name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Tests use the rule engine, so skip the heavy detector/face packages and use CPU torch.
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: >
          pip install fastapi==0.115.6 python-multipart==0.0.17 pydantic==2.10.3 sqlmodel==0.0.22
          passlib==1.7.4 pyjwt==2.10.1 opencv-python-headless numpy==2.1.3 pyotp==2.9.0
          requests==2.32.3 pytest httpx
      - run: pytest -q
